name: Romskanner
options:
  bundleIdPrefix: no.yzeyr
  deploymentTarget:
    iOS: "17.0"
targets:
  Romskanner:
    type: application
    platform: iOS
    sources:
      - Romskanner
    info:
      path: Romskanner/Info.plist
      properties:
        CFBundleDisplayName: Romskanner
        CFBundleShortVersionString: "1.6"
        CFBundleVersion: "7"
        NSCameraUsageDescription: Kameraet og LiDAR-sensoren brukes til å måle opp rommet.
        UILaunchScreen: {}
        UIRequiredDeviceCapabilities: [arkit]
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        LSRequiresIPhoneOS: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: no.yzeyr.romskanner
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "5.0"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
