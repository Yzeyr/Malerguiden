name: Romskanner
options:
  bundleIdPrefix: no.yzeyr
  deploymentTarget:
    iOS: "17.0"
targets:
  Romskanner:
    type: application
    platform: iOS
    sources:
      - Romskanner
      # Delt med låseskjermdelen: jobbene som vises der
      - Felles
      # Nettappen, kopiert inn av byggejobben (se .github/workflows/romskanner.yml)
      - path: Web
        type: folder
        optional: true
    # Apple Intelligence finnes bare fra iOS 26: koblet løst, så appen starter på eldre iOS også
    dependencies:
      - sdk: FoundationModels.framework
        weak: true
      # Jobbene på låseskjermen (WidgetKit), bygget inn i appen
      - target: Laaseskjerm
    info:
      path: Romskanner/Info.plist
      properties:
        CFBundleDisplayName: Malerguiden
        CFBundleShortVersionString: "3.10"
        CFBundleVersion: "29"
        NSCameraUsageDescription: Kameraet og LiDAR-sensoren brukes til å måle opp rom, skanne ting til 3D-modeller, lese etiketter og prøvemale vegger.
        NSPhotoLibraryUsageDescription: Bilder fra biblioteket kan legges på jobbene.
        NSPhotoLibraryAddUsageDescription: Bilder av prøvemalingen kan lagres i Bilder.
        UILaunchScreen: {}
        UIRequiredDeviceCapabilities: [arkit]
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        LSRequiresIPhoneOS: true
        # Appens mappe vises i Filer (På min iPhone → Malerguiden), der kopiene ligger uten valgt mappe
        UIFileSharingEnabled: true
        # Klokka og tørketiden på Dynamic Island
        NSSupportsLiveActivities: true
        LSSupportsOpeningDocumentsInPlace: true
        # malerguiden://jobb/<id> fra låseskjermen åpner jobben
        CFBundleURLTypes:
          - CFBundleURLName: no.yzeyr.romskanner
            CFBundleURLSchemes: [malerguiden]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: no.yzeyr.romskanner
        CODE_SIGN_ENTITLEMENTS: Romskanner/Romskanner.entitlements
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "5.0"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO

  # Jobbene på låseskjermen og hjemskjermen
  Laaseskjerm:
    type: app-extension
    platform: iOS
    sources:
      - Laaseskjerm
      - Felles
    dependencies:
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
    info:
      path: Laaseskjerm/Info.plist
      properties:
        CFBundleDisplayName: Malerguiden
        CFBundleShortVersionString: "3.10"
        CFBundleVersion: "29"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: no.yzeyr.romskanner.laaseskjerm
        CODE_SIGN_ENTITLEMENTS: Laaseskjerm/Laaseskjerm.entitlements
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: NO
        SKIP_INSTALL: YES
