name: Deploy Malerguiden til GitHub Pages

# Kjører ved hver push til main. Tidligere kjørte den bare når index.html
# endret seg, så endringer i sw.js, manifest og ikoner ble aldri publisert.
on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Sjekk ut kode
        uses: actions/checkout@v4

      - name: Sett opp Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # Testene og versjonssjekken må bestå før noe publiseres. Versjonen i
      # sw.js må stemme med filene, ellers får telefonene ikke den nye koden.
      - name: Tester
        run: node --test

      - name: Sjekk at sw.js har riktig versjon
        run: node tools/versjon.mjs --sjekk

      - name: Sett opp GitHub Pages
        uses: actions/configure-pages@v5

      - name: Last opp siden som Pages-artefakt
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy til GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
